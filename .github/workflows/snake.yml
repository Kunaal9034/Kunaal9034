name: generate animation

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main or master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Generate snake SVG using Platane/snk
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kunaal9034
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#FF2E63&color_dots=#161b22,#4A0E17,#8B0000,#FF2E63,#FFD700

      # Commit and push generated asset back to main branch
      - name: Commit and Push Snake SVG
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update github contribution snake animation [skip ci]"
          file_pattern: "assets/github-contribution-grid-snake.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
