name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # -----------------------------
      # GitHub Stats
      # -----------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=050508&title_color=FF2E63&icon_color=00F5D4&text_color=EAEAEA&count_private=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Top Languages
      # -----------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=050508&title_color=FF2E63&text_color=EAEAEA
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # GitHub Trophies
      # -----------------------------
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=onestar&no-frame=true&no-bg=true&margin-w=8&margin-h=8
          path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Contribution Activity Graph
      # -----------------------------
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Contribution Snake
      # -----------------------------
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#FF2E63&color_dots=#161b22,#4A0E17,#8B0000,#FF2E63,#FFD700

      # -----------------------------
      # Commit generated SVG files
      # -----------------------------
      - name: Commit Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          git diff --cached --quiet || git commit -m "chore: update profile stats"

          git push
