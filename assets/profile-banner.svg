<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#050508; overflow:hidden;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="nebula-crimson" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B0F1A" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0F0307" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-orange" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E2711D" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-cyan" cx="50%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="cyber-line-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF2E63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0" />
    </linearGradient>

    <!-- Traditional Chinese Lattice Pattern -->
    <pattern id="chinese-lattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0,30 H 60 M 30,0 V 60" stroke="#FF2E63" stroke-width="0.75" stroke-opacity="0.08" fill="none" />
      <path d="M 15,15 H 45 V 45 H 15 Z" stroke="#FF2E63" stroke-width="0.75" stroke-opacity="0.08" fill="none" />
      <path d="M 0,15 H 15 V 0 M 45,0 V 15 H 60 M 60,45 H 45 V 60 M 15,60 V 45 H 0" stroke="#FFE066" stroke-width="0.5" stroke-opacity="0.05" fill="none" />
      <circle cx="30" cy="30" r="3" fill="#FF2E63" fill-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .particle {
      animation: float-slow 10s infinite ease-in-out;
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
    }
    
    .circuit-beam {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: stream 6s linear infinite;
    }
    @keyframes stream {
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="#050508" />

  <!-- Cosmic Nebula Glows -->
  <rect width="100%" height="100%" fill="url(#nebula-crimson)" />
  <rect width="100%" height="100%" fill="url(#nebula-orange)" />
  <rect width="100%" height="100%" fill="url(#nebula-cyan)" />

  <!-- Cyber Grid Perspective Background -->
  <g opacity="0.25">
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#FF2E63" stroke-width="1" />
    <!-- Perspective rays -->
    <line x1="600" y1="250" x2="-300" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="100" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="350" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="600" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="850" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="1100" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <line x1="600" y1="250" x2="1500" y2="400" stroke="#FF2E63" stroke-width="0.5" />
    <!-- Horizontal lines -->
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#FF2E63" stroke-width="0.5" opacity="0.4" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#FF2E63" stroke-width="0.5" opacity="0.6" />
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#FF2E63" stroke-width="0.5" opacity="0.8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#FF2E63" stroke-width="0.5" />
  </g>

  <!-- Chinese Lattice Overlays at the sides -->
  <rect x="0" y="0" width="300" height="400" fill="url(#chinese-lattice)" opacity="0.8" />
  <rect x="900" y="0" width="300" height="400" fill="url(#chinese-lattice)" opacity="0.8" />

  <!-- Center Energy Core and HUD rings -->
  <g transform="translate(600, 180)" opacity="0.7">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FF2E63" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00F5D4" stroke-width="1" stroke-dasharray="10 8" stroke-opacity="0.3" class="circuit-beam" style="animation-duration: 10s;" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFE066" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="0" cy="0" r="10" fill="#FF2E63" filter="url(#glow-red)" />
  </g>

  <!-- Circuits and Cyber Lines -->
  <g stroke="#00F5D4" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Horizontal energy tracks -->
    <path d="M 100 80 H 450 L 480 110 H 720 L 750 80 H 1100" class="circuit-beam" />
    <path d="M 150 320 H 400 L 430 290 H 770 L 800 320 H 1050" stroke="#FF2E63" class="circuit-beam" style="animation-duration: 8s; animation-direction: reverse;" />
  </g>

  <!-- Ambient Glowing Dust Particles -->
  <g fill="#FFF">
    <circle cx="200" cy="120" r="2" fill="#FFC947" class="particle" style="animation-delay: 0s; animation-duration: 8s;" />
    <circle cx="450" cy="80" r="3" fill="#FF2E63" class="particle" style="animation-delay: 2s; animation-duration: 12s;" filter="url(#glow-red)"/>
    <circle cx="780" cy="140" r="1.5" fill="#FFE066" class="particle" style="animation-delay: 4s; animation-duration: 7s;" />
    <circle cx="1020" cy="90" r="2.5" fill="#00F5D4" class="particle" style="animation-delay: 1s; animation-duration: 9s;" filter="url(#glow-cyan)"/>
    <circle cx="350" cy="280" r="2" fill="#FF9F43" class="particle" style="animation-delay: 3s; animation-duration: 11s;" />
    <circle cx="850" cy="260" r="3" fill="#FF2E63" class="particle" style="animation-delay: 5s; animation-duration: 6s;" filter="url(#glow-red)" />
  </g>

  <!-- Border HUD lines -->
  <rect x="15" y="15" width="1170" height="370" fill="none" stroke="#FF2E63" stroke-opacity="0.1" stroke-width="1" />
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#FF2E63" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 1185 40 L 1185 15 L 1160 15" fill="none" stroke="#FF2E63" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 15 360 L 15 385 L 40 385" fill="none" stroke="#FF2E63" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 1185 360 L 1185 385 L 1160 385" fill="none" stroke="#FF2E63" stroke-width="2" stroke-opacity="0.6" />
</svg>
