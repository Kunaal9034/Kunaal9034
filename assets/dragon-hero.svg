<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#050508; overflow:hidden; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyber-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="cyber-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F77F00" />
    </linearGradient>
    <linearGradient id="cyber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="50%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#005F73" />
    </linearGradient>
    <linearGradient id="dark-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D30" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <radialGradient id="bg-nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A0E17" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Background Elements Animations */
    .star {
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .grid-line {
      stroke: #8B0000;
      stroke-opacity: 0.15;
      stroke-width: 1;
    }

    /* Ambient drifting particles */
    .ambient-particle {
      animation: drift 8s linear infinite;
      fill-opacity: 0.6;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translate(-300px, -50px); opacity: 0; }
    }

    /* Dragon Core Animations */
    .dragon-group {
      animation: fly-across 14s linear infinite;
      transform-origin: center;
    }
    @keyframes fly-across {
      0% { transform: translate(-700px, 40px); }
      100% { transform: translate(1300px, -40px); }
    }

    /* Serpentine Slither Animation */
    .segment {
      animation: slither 3.5s ease-in-out infinite alternate;
      transform-origin: center;
    }
    #seg-head  { animation-delay: 0.0s; }
    #seg-neck  { animation-delay: -0.3s; }
    #seg-body1 { animation-delay: -0.6s; }
    #seg-body2 { animation-delay: -0.9s; }
    #seg-body3 { animation-delay: -1.2s; }
    #seg-body4 { animation-delay: -1.5s; }
    #seg-body5 { animation-delay: -1.8s; }
    #seg-tail  { animation-delay: -2.1s; }

    @keyframes slither {
      0% { transform: translateY(-25px) rotate(-3deg); }
      100% { transform: translateY(25px) rotate(3deg); }
    }

    /* Flapping whiskers and hair */
    .flowing-whisker {
      animation: whisker-wave 2s ease-in-out infinite alternate;
      transform-origin: 520px 145px;
    }
    @keyframes whisker-wave {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(8deg); }
    }

    /* Cyber pulsing circuit lines */
    .circuit-pulse {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: pulse-circuits 4s linear infinite;
    }
    @keyframes pulse-circuits {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    /* Fire flame coming out of mouth */
    .mouth-fire {
      animation: fire-flicker 0.15s ease-in-out infinite alternate;
      transform-origin: 535px 165px;
    }
    @keyframes fire-flicker {
      0% { transform: scale(0.9) rotate(-2deg); opacity: 0.8; }
      100% { transform: scale(1.1) rotate(2deg); opacity: 1; filter: drop-shadow(0 0 8px #FF7A00); }
    }

    /* Scanning HUD Ring */
    .hud-scanner {
      transform-origin: 525px 140px;
      animation: rotate-hud 6s linear infinite;
    }
    @keyframes rotate-hud {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- BACKGROUND: Cinematic space tech layout -->
  <rect width="100%" height="100%" fill="#050508" />
  <rect width="1200" height="400" fill="url(#bg-nebula)" />

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="100" cy="80" r="1" class="star" style="animation-delay:0.2s;" />
    <circle cx="280" cy="140" r="1.5" class="star" style="animation-delay:1.1s;" />
    <circle cx="450" cy="60" r="1" class="star" style="animation-delay:0.5s;" />
    <circle cx="680" cy="110" r="2" class="star" style="animation-delay:2.3s;" />
    <circle cx="850" cy="70" r="1.2" class="star" style="animation-delay:1.7s;" />
    <circle cx="1050" cy="150" r="1" class="star" style="animation-delay:0.8s;" />
    <circle cx="950" cy="90" r="1.5" class="star" style="animation-delay:3.0s;" />
    <circle cx="150" cy="220" r="1" class="star" style="animation-delay:1.5s;" />
    <circle cx="1120" cy="260" r="1.3" class="star" style="animation-delay:0.4s;" />
  </g>

  <!-- Cyber grid in perspective at the bottom -->
  <g>
    <!-- Horizon -->
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#FF2E63" stroke-opacity="0.25" stroke-width="1.5" filter="url(#neon-glow-red)"/>
    <!-- Grid Horizontal Lines -->
    <line x1="0" y1="295" x2="1200" y2="295" class="grid-line" stroke-opacity="0.1" />
    <line x1="0" y1="315" x2="1200" y2="315" class="grid-line" stroke-opacity="0.15" />
    <line x1="0" y1="340" x2="1200" y2="340" class="grid-line" stroke-opacity="0.25" />
    <line x1="0" y1="375" x2="1200" y2="375" class="grid-line" stroke-opacity="0.35" />
    <!-- Grid Perspective Lines -->
    <line x1="600" y1="280" x2="-200" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="100" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="350" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="520" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="680" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="850" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="1100" y2="400" class="grid-line" />
    <line x1="600" y1="280" x2="1400" y2="400" class="grid-line" />
  </g>

  <!-- Ambient glowing particles drifting -->
  <g>
    <circle cx="1000" cy="180" r="2.5" fill="#FF7F50" class="ambient-particle" style="animation-delay: 0s; animation-duration: 9s;"/>
    <circle cx="1100" cy="120" r="1.5" fill="#FFC947" class="ambient-particle" style="animation-delay: 2s; animation-duration: 7s;"/>
    <circle cx="850" cy="240" r="3.0" fill="#FF2E63" class="ambient-particle" style="animation-delay: 4s; animation-duration: 11s;"/>
    <circle cx="1150" cy="290" r="2.0" fill="#00F5D4" class="ambient-particle" style="animation-delay: 1s; animation-duration: 8s;"/>
    <circle cx="950" cy="60" r="1.8" fill="#FFE066" class="ambient-particle" style="animation-delay: 5s; animation-duration: 6s;"/>
  </g>

  <!-- DRAGON: Flying group from left to right -->
  <g class="dragon-group">

    <!-- ENERGY TRAIL 1 -->
    <path d="M-100 170 Q 150 120, 250 170 T 500 170" fill="none" stroke="url(#cyber-orange)" stroke-width="2.5" opacity="0.3" stroke-dasharray="12 6" />
    <!-- ENERGY TRAIL 2 -->
    <path d="M-80 185 Q 180 205, 280 185 T 480 185" fill="none" stroke="#00F5D4" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />

    <!-- DRAGON SECTIONS -->

    <!-- ================= SEGMENT 7: TAIL FIN ================= -->
    <g id="seg-tail" class="segment">
      <!-- Cyber Tail Spike -->
      <path d="M70 180 L 30 160 L 50 180 L 30 200 Z" fill="url(#cyber-red)" filter="url(#neon-glow-red)" />
      <path d="M65 180 L 45 172 L 52 180 L 45 188 Z" fill="#FFE066" />
      <line x1="70" y1="180" x2="110" y2="180" stroke="#FF2E63" stroke-width="3" />
      <!-- Thruster flame on tail -->
      <polygon points="30,180 10,175 20,180 10,185" fill="#00F5D4" filter="url(#neon-glow-cyan)" opacity="0.8" />
    </g>

    <!-- ================= SEGMENT 6: TAIL CONNECTOR ================= -->
    <g id="seg-body5" class="segment">
      <rect x="110" y="165" width="40" height="30" rx="6" fill="url(#dark-plate)" stroke="url(#cyber-red)" stroke-width="1.5" />
      <path d="M120 165 C 130 155, 140 155, 150 165" fill="none" stroke="#FFE066" stroke-width="2" />
      <!-- Spikes -->
      <polygon points="130,165 130,145 138,165" fill="url(#cyber-gold)" />
      <!-- Circuit accents -->
      <line x1="120" y1="180" x2="140" y2="180" stroke="#00F5D4" stroke-width="2" class="circuit-pulse" />
    </g>

    <!-- ================= SEGMENT 5: REAR BODY ================= -->
    <g id="seg-body4" class="segment">
      <!-- Mechanical plating -->
      <path d="M160 160 L 210 155 L 210 205 L 160 200 Z" fill="url(#dark-plate)" stroke="#FF2E63" stroke-width="2" />
      <!-- Golden dragon back scale scale-plate -->
      <path d="M175 160 Q 185 140 195 160 Z" fill="url(#cyber-gold)" />
      <!-- Glow core -->
      <circle cx="185" cy="180" r="7" fill="#FF7F50" filter="url(#neon-glow-orange)" />
      <circle cx="185" cy="180" r="3" fill="#FFF" />
    </g>

    <!-- ================= SEGMENT 4: REAR BODY and CLAW ================= -->
    <g id="seg-body3" class="segment">
      <!-- Cybernetic Arm/Leg Rear -->
      <path d="M220 190 Q 200 230, 230 250" fill="none" stroke="url(#dark-plate)" stroke-width="12" stroke-linecap="round" />
      <path d="M220 190 Q 200 230, 230 250" fill="none" stroke="#FF2E63" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow-red)" />
      <!-- Claw -->
      <path d="M230 250 L 220 270 M 230 250 L 235 273 M 230 250 L 250 265" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow-cyan)" />
      
      <!-- Body Segment -->
      <path d="M220 155 L 275 155 L 275 205 L 220 205 Z" fill="url(#dark-plate)" stroke="#FF2E63" stroke-width="2" />
      <!-- Circuit pattern on plate -->
      <path d="M230 165 H 260 V 195 H 240" fill="none" stroke="#FFE066" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="245,155 247,135 257,155" fill="url(#cyber-gold)" />
    </g>

    <!-- ================= SEGMENT 3: MIDDLE CORE ================= -->
    <g id="seg-body2" class="segment">
      <!-- Main generator segment -->
      <rect x="285" y="150" width="65" height="60" rx="10" fill="url(#dark-plate)" stroke="url(#cyber-red)" stroke-width="2" />
      <!-- Exposed plasma cell -->
      <rect x="300" y="165" width="35" height="30" fill="#000" rx="3" stroke="#00F5D4" stroke-width="1" />
      <line x1="305" y1="180" x2="330" y2="180" stroke="#00F5D4" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow-cyan)" class="circuit-pulse" />
      <!-- Heavy back spines -->
      <path d="M300 150 L 310 120 L 325 150 Z" fill="url(#cyber-gold)" />
      <path d="M320 150 L 330 125 L 340 150 Z" fill="url(#cyber-gold)" />
    </g>

    <!-- ================= SEGMENT 2: FRONT BODY and CLAW ================= -->
    <g id="seg-body1" class="segment">
      <!-- Cybernetic Arm/Leg Front -->
      <path d="M370 190 Q 360 240, 390 260" fill="none" stroke="url(#dark-plate)" stroke-width="12" stroke-linecap="round" />
      <path d="M370 190 Q 360 240, 390 260" fill="none" stroke="#FF2E63" stroke-width="4" stroke-linecap="round" filter="url(#neon-glow-red)" />
      <!-- Claw -->
      <path d="M390 260 L 380 282 M 390 260 L 398 285 M 390 260 L 412 276" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow-cyan)" />

      <!-- Body Segment -->
      <path d="M360 150 L 420 150 L 410 205 L 360 205 Z" fill="url(#dark-plate)" stroke="#FF2E63" stroke-width="2" />
      <!-- Overlapping Golden Dragon Scales -->
      <path d="M375 160 C 385 165, 385 175, 375 180" fill="none" stroke="url(#cyber-gold)" stroke-width="2" />
      <path d="M390 165 C 400 170, 400 180, 390 185" fill="none" stroke="url(#cyber-gold)" stroke-width="2" />
      <path d="M380 180 C 390 185, 390 195, 380 200" fill="none" stroke="url(#cyber-gold)" stroke-width="2" />
      <polygon points="385,150 388,125 398,150" fill="url(#cyber-gold)" />
    </g>

    <!-- ================= SEGMENT 1: NECK SECTION ================= -->
    <g id="seg-neck" class="segment">
      <path d="M430 150 L 485 145 L 475 205 L 425 205 Z" fill="url(#dark-plate)" stroke="#FF2E63" stroke-width="2" />
      <!-- Neck hydraulic cylinder -->
      <line x1="440" y1="175" x2="475" y2="175" stroke="#FFE066" stroke-width="4" stroke-linecap="round" />
      <line x1="440" y1="185" x2="470" y2="185" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" filter="url(#neon-glow-cyan)" />
      <!-- Neck Spikes -->
      <polygon points="450,147 455,120 463,146" fill="url(#cyber-gold)" />
      <polygon points="465,146 472,122 478,145" fill="url(#cyber-gold)" />
    </g>

    <!-- ================= SEGMENT 0: DRAGON HEAD ================= -->
    <g id="seg-head" class="segment">
      <!-- Flowing whiskers back (Red and Gold) -->
      <path d="M520 145 Q 460 110, 410 135" fill="none" stroke="url(#cyber-red)" stroke-width="3" stroke-linecap="round" class="flowing-whisker" filter="url(#neon-glow-red)" />
      <path d="M520 150 Q 470 120, 420 142" fill="none" stroke="url(#cyber-gold)" stroke-width="2.5" stroke-linecap="round" class="flowing-whisker" />

      <!-- Back Horn (Golden tech plate) -->
      <path d="M530 125 L 480 75 Q 465 75, 475 90 L 515 125 Z" fill="url(#cyber-gold)" stroke="#FF2E63" stroke-width="1" filter="url(#neon-glow-orange)" />
      <line x1="505" y1="105" x2="485" y2="85" stroke="#FFF" stroke-width="1.5" />

      <!-- Head Base Armor -->
      <path d="M490 140 L 550 125 L 565 145 L 555 170 L 530 185 L 485 170 Z" fill="url(#dark-plate)" stroke="#FF2E63" stroke-width="2.5" />

      <!-- Cyber eye (Cyan neon) -->
      <polygon points="515,138 535,135 528,145 512,143" fill="#00F5D4" filter="url(#neon-glow-cyan)" />
      <polygon points="518,139 530,137 526,143 516,142" fill="#FFF" />

      <!-- Jaw mechanical lines -->
      <path d="M530 185 L 550 178 L 545 168 Z" fill="#141416" stroke="#FF2E63" stroke-width="1.5" />
      <!-- Teeth -->
      <polygon points="548,155 544,162 552,162" fill="#FFF" />
      <polygon points="538,157 534,164 542,164" fill="#FFF" />
      
      <!-- Whiskers front (flowing forward and back) -->
      <path d="M555 160 Q 590 165, 620 190" fill="none" stroke="url(#cyber-gold)" stroke-width="2" stroke-linecap="round" />
      <path d="M550 165 Q 580 180, 600 210" fill="none" stroke="url(#cyber-red)" stroke-width="1.5" stroke-linecap="round" />

      <!-- HUD Target ring over the eye -->
      <circle cx="525" cy="140" r="15" fill="none" stroke="#00F5D4" stroke-width="0.75" stroke-dasharray="6 4" class="hud-scanner" />
      <circle cx="525" cy="140" r="2" fill="#00F5D4" />

      <!-- Mouth Engine Exhaust Fire -->
      <g class="mouth-fire">
        <!-- Inner orange plasma flame -->
        <path d="M555 155 Q 630 150, 660 162 Q 600 175, 552 168 Z" fill="url(#cyber-orange)" filter="url(#neon-glow-orange)" />
        <!-- Core yellow flame -->
        <path d="M555 158 Q 610 155, 630 162 Q 595 170, 552 165 Z" fill="#FFE066" />
        <!-- Red energy sparks from mouth -->
        <circle cx="645" cy="155" r="3" fill="#FF2E63" filter="url(#neon-glow-red)" />
        <circle cx="670" cy="165" r="1.5" fill="#FFE066" />
      </g>
    </g>

  </g>

  <!-- FOREGROUND HUD OVERLAY -->
  <rect x="20" y="20" width="1160" height="360" fill="none" stroke="#FF2E63" stroke-opacity="0.15" stroke-width="1" />
  <!-- Corner Tech Elements -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#FF2E63" stroke-width="3" filter="url(#neon-glow-red)" />
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#FF2E63" stroke-width="3" filter="url(#neon-glow-red)" />
  <path d="M 20 350 L 20 380 L 50 380" fill="none" stroke="#FF2E63" stroke-width="3" filter="url(#neon-glow-red)" />
  <path d="M 1180 350 L 1180 380 L 1150 380" fill="none" stroke="#FF2E63" stroke-width="3" filter="url(#neon-glow-red)" />

  <!-- Subtly placed technical coordinates/labels -->
  <text x="35" y="42" fill="#FF2E63" font-size="10" font-weight="bold" letter-spacing="2" opacity="0.6">SYS.DRGN_ENG.ON</text>
  <text x="1065" y="42" fill="#00F5D4" font-size="10" font-weight="bold" letter-spacing="2" opacity="0.6">GRID.COORD_889</text>
</svg>
