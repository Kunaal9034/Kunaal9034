<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%" style="background:#050508; overflow:hidden;">
  <defs>
    <filter id="particle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .glow-dot {
      animation: float-ember 6s infinite ease-in-out;
      fill-opacity: 0.8;
    }
    @keyframes float-ember {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-40px) translateX(-20px); opacity: 0; }
    }
  </style>

  <!-- Glowing drifting particles -->
  <g filter="url(#particle-glow)">
    <circle cx="50" cy="80" r="3" fill="#FF2E63" class="glow-dot" style="animation-delay: 0s; animation-duration: 6s;" />
    <circle cx="120" cy="110" r="1.5" fill="#FFE066" class="glow-dot" style="animation-delay: 1.5s; animation-duration: 5s;" />
    <circle cx="200" cy="60" r="2.5" fill="#00F5D4" class="glow-dot" style="animation-delay: 3s; animation-duration: 7s;" />
    <circle cx="280" cy="90" r="2" fill="#FF9F43" class="glow-dot" style="animation-delay: 0.8s; animation-duration: 5.5s;" />
    <circle cx="340" cy="120" r="3.5" fill="#FF2E63" class="glow-dot" style="animation-delay: 2.2s; animation-duration: 6.5s;" />
    
    <circle cx="90" cy="40" r="2" fill="#00F5D4" class="glow-dot" style="animation-delay: 4.1s; animation-duration: 4.8s;" />
    <circle cx="160" cy="130" r="2.5" fill="#FFC947" class="glow-dot" style="animation-delay: 1.1s; animation-duration: 6.2s;" />
    <circle cx="240" cy="70" r="1.5" fill="#FFE066" class="glow-dot" style="animation-delay: 2.8s; animation-duration: 5s;" />
    <circle cx="310" cy="30" r="3" fill="#FF2E63" class="glow-dot" style="animation-delay: 0.5s; animation-duration: 7.2s;" />
    <circle cx="370" cy="80" r="2" fill="#00F5D4" class="glow-dot" style="animation-delay: 3.5s; animation-duration: 5.8s;" />
  </g>
</svg>
